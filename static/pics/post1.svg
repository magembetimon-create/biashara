<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-label="Karibu kwenye machapisho">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#A0522D"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="340" rx="20" fill="url(#bg1)"/>

  <!-- Decorative circles -->
  <circle cx="360" cy="50" r="40" fill="#007bff" opacity="0.08"/>
  <circle cx="40" cy="280" r="55" fill="#FF8A00" opacity="0.1"/>
  <circle cx="380" cy="260" r="25" fill="#8B4513" opacity="0.08"/>

  <!-- Feed cards stack -->
  <g filter="url(#softShadow)">
    <!-- Back card -->
    <rect x="95" y="55" width="230" height="155" rx="14" fill="#fff" opacity="0.7" transform="rotate(-4 210 132)"/>
    <!-- Middle card -->
    <rect x="88" y="68" width="230" height="155" rx="14" fill="#fff" opacity="0.85" transform="rotate(-2 203 145)"/>
    <!-- Front card -->
    <rect x="80" y="82" width="230" height="155" rx="14" fill="#fff"/>
    <!-- Image area -->
    <rect x="92" y="94" width="206" height="88" rx="10" fill="#E8EEF7"/>
    <!-- Image placeholder icon -->
    <rect x="155" y="112" width="80" height="52" rx="8" fill="#C5D5EF"/>
    <circle cx="175" cy="128" r="10" fill="#007bff" opacity="0.5"/>
    <path d="M155 152 L185 128 L205 142 L230 118 L248 152 Z" fill="#007bff" opacity="0.35"/>
    <!-- Text lines -->
    <rect x="92" y="192" width="140" height="8" rx="4" fill="#E0E0E0"/>
    <rect x="92" y="208" width="100" height="6" rx="3" fill="#EEEEEE"/>
    <!-- Like icon -->
    <circle cx="268" cy="200" r="14" fill="#FFF0E6"/>
    <path d="M262 200 C262 196 266 194 268 198 C270 194 274 196 274 200 C274 205 268 210 268 210 C268 210 262 205 262 200Z" fill="#FF8A00"/>
  </g>

  <!-- Phone mockup -->
  <g filter="url(#softShadow)">
    <rect x="248" y="175" width="110" height="145" rx="16" fill="#2D3748"/>
    <rect x="256" y="188" width="94" height="115" rx="8" fill="#fff"/>
    <!-- Mini posts on phone -->
    <rect x="262" y="194" width="82" height="38" rx="6" fill="#F0F4FF"/>
    <rect x="268" y="200" width="30" height="26" rx="4" fill="#007bff" opacity="0.3"/>
    <rect x="302" y="202" width="36" height="5" rx="2" fill="#CBD5E0"/>
    <rect x="302" y="212" width="28" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="262" y="238" width="82" height="38" rx="6" fill="#FFF8F3"/>
    <rect x="268" y="244" width="30" height="26" rx="4" fill="#FF8A00" opacity="0.3"/>
    <rect x="302" y="246" width="36" height="5" rx="2" fill="#CBD5E0"/>
    <rect x="302" y="256" width="28" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="278" y="282" width="50" height="4" rx="2" fill="#4A5568"/>
  </g>

  <!-- Welcome badge -->
  <rect x="30" y="240" width="155" height="44" rx="22" fill="url(#brownGrad)"/>
  <text x="107" y="268" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Karibu!</text>

  <!-- Subtitle -->
  <text x="210" y="318" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="13">Machapisho kutoka biashara zako</text>
  <text x="210" y="334" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="11">Scroll chini kuona zaidi</text>

  <!-- Sparkle accents -->
  <path d="M55 90 L58 98 L66 98 L60 103 L62 111 L55 106 L48 111 L50 103 L44 98 L52 98 Z" fill="#FF8A00" opacity="0.7"/>
  <path d="M340 130 L342 135 L347 135 L343 138 L345 143 L340 140 L335 143 L337 138 L333 135 L338 135 Z" fill="#007bff" opacity="0.6"/>
</svg>
