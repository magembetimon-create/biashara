<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Kuza biashara yako">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="50%" stop-color="#FFF8F3"/>
      <stop offset="100%" stop-color="#FFF0E6"/>
    </linearGradient>
    <linearGradient id="shopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="360" rx="20" fill="url(#bg2)"/>

  <!-- Decorative wave -->
  <path d="M0 300 Q105 270 210 290 T420 280 L420 360 L0 360 Z" fill="#007bff" opacity="0.06"/>
  <path d="M0 320 Q140 295 280 310 T420 300 L420 360 L0 360 Z" fill="#FF8A00" opacity="0.06"/>

  <!-- Growth chart -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="60" width="160" height="120" rx="14" fill="#fff"/>
    <text x="120" y="82" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Ukuaji</text>
    <!-- Chart bars -->
    <rect x="58" y="130" width="18" height="30" rx="4" fill="#E2E8F0"/>
    <rect x="84" y="115" width="18" height="45" rx="4" fill="#C5D5EF"/>
    <rect x="110" y="100" width="18" height="60" rx="4" fill="#007bff" opacity="0.5"/>
    <rect x="136" y="88" width="18" height="72" rx="4" fill="#007bff" opacity="0.75"/>
    <rect x="162" y="72" width="18" height="88" rx="4" fill="url(#growthGrad)"/>
    <!-- Trend line -->
    <polyline points="67,145 93,120 119,105 145,92 171,78" fill="none" stroke="#FF8A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="171" cy="78" r="5" fill="#FF8A00"/>
  </g>

  <!-- Shop / storefront -->
  <g filter="url(#cardShadow)">
    <rect x="220" y="55" width="160" height="130" rx="14" fill="#fff"/>
    <!-- Awning -->
    <path d="M232 95 L368 95 L360 78 L240 78 Z" fill="url(#shopGrad)"/>
    <path d="M240 78 L248 95 M260 78 L268 95 M280 78 L288 95 M300 78 L308 95 M320 78 L328 95 M340 78 L348 95 M360 78 L368 95" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
    <!-- Shop body -->
    <rect x="240" y="95" width="120" height="75" rx="4" fill="#F7FAFC"/>
    <!-- Door -->
    <rect x="285" y="115" width="30" height="55" rx="4" fill="#8B4513" opacity="0.7"/>
    <circle cx="308" cy="145" r="2.5" fill="#FFD700"/>
    <!-- Windows -->
    <rect x="248" y="108" width="28" height="28" rx="4" fill="#E8EEF7"/>
    <rect x="324" y="108" width="28" height="28" rx="4" fill="#E8EEF7"/>
    <line x1="262" y1="108" x2="262" y2="136" stroke="#C5D5EF" stroke-width="1"/>
    <line x1="248" y1="122" x2="276" y2="122" stroke="#C5D5EF" stroke-width="1"/>
    <line x1="338" y1="108" x2="338" y2="136" stroke="#C5D5EF" stroke-width="1"/>
    <line x1="324" y1="122" x2="352" y2="122" stroke="#C5D5EF" stroke-width="1"/>
  </g>

  <!-- Connection network -->
  <g opacity="0.9">
    <circle cx="210" cy="200" r="22" fill="#fff" stroke="#007bff" stroke-width="2.5" filter="url(#cardShadow)"/>
    <circle cx="210" cy="200" r="8" fill="#007bff"/>
    <!-- Nodes -->
    <circle cx="120" cy="210" r="14" fill="#fff" stroke="#FF8A00" stroke-width="2"/>
    <circle cx="120" cy="210" r="5" fill="#FF8A00"/>
    <circle cx="300" cy="210" r="14" fill="#fff" stroke="#8B4513" stroke-width="2"/>
    <circle cx="300" cy="210" r="5" fill="#8B4513"/>
    <circle cx="170" cy="250" r="12" fill="#fff" stroke="#007bff" stroke-width="2"/>
    <circle cx="170" cy="250" r="4" fill="#007bff"/>
    <circle cx="250" cy="250" r="12" fill="#fff" stroke="#FF8A00" stroke-width="2"/>
    <circle cx="250" cy="250" r="4" fill="#FF8A00"/>
    <!-- Lines -->
    <line x1="134" y1="210" x2="188" y2="200" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="232" y1="200" x2="286" y2="210" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="205" y1="218" x2="176" y2="242" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="215" y1="218" x2="244" y2="242" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- CTA banner -->
  <rect x="30" y="278" width="360" height="56" rx="28" fill="url(#shopGrad)" filter="url(#cardShadow)"/>
  <text x="210" y="304" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Kuza Biashara Yako</text>
  <text x="210" y="322" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="11" opacity="0.85">Chapisha · Uza · Ungana na wateja</text>

  <!-- Arrow up (growth) -->
  <g transform="translate(355, 175)">
    <circle cx="0" cy="0" r="20" fill="#FF8A00" opacity="0.15"/>
    <path d="M0 -10 L8 2 L3 2 L3 10 L-3 10 L-3 2 L-8 2 Z" fill="#FF8A00"/>
  </g>
</svg>
