<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1c">
  <title>Hakuna mtandao · FanyaBiashara</title>
  <link rel="icon" type="image/png" href="/pwa/icon-192.png">
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #1c1c1c;
      --muted: #5b6b82;
      --blue: #007bff;
      --line: #e6ebf2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 22px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(28, 28, 28, 0.08);
    }
    .art {
      width: 220px;
      height: 220px;
      margin: 0 auto 18px;
      border-radius: 24px;
      overflow: hidden;
      background: #eef3f9;
    }
    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .btn {
      appearance: none;
      border: 0;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      padding: 12px 18px;
      min-width: 180px;
      cursor: pointer;
    }
    .btn:active { transform: translateY(1px); }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #8a97ab;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="art">
      <img src="/pwa/offline.png" alt="" id="offlineArt">
    </div>
    <h1 id="offlineTitle"></h1>
    <p id="offlineMsg"></p>
    <button class="btn" type="button" id="retryBtn"></button>
    <div class="hint">FanyaBiashara</div>
  </main>
  <script>
    (function () {
      var isSwa = true;
      try {
        isSwa = localStorage.getItem('fb_lang') !== '1';
      } catch (e) {}
      document.documentElement.lang = isSwa ? 'sw' : 'en';
      document.title = isSwa ? 'Hakuna mtandao' : 'No internet';
      document.getElementById('offlineArt').alt = isSwa ? 'Hakuna mtandao' : 'No internet';
      document.getElementById('offlineTitle').textContent = isSwa ? 'Hakuna mtandao' : 'No internet';
      document.getElementById('offlineMsg').textContent = isSwa
        ? 'Angalia muunganisho wako kisha jaribu tena. App itarudi yenyewe pindi mtandao utakaporudi.'
        : 'Check your connection and try again. The app will return automatically when you are back online.';
      document.getElementById('retryBtn').textContent = isSwa ? 'Jaribu tena' : 'Try again';

      function goBackOnline() {
        if (navigator.onLine) {
          location.replace(document.referrer && document.referrer.indexOf(location.origin) === 0
            ? document.referrer
            : '/login');
        } else {
          location.reload();
        }
      }
      document.getElementById('retryBtn').addEventListener('click', goBackOnline);
      window.addEventListener('online', goBackOnline);
    })();
  </script>
</body>
</html>
